name: CI & Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E (Galaxy Tab S11 viewport, emulated S Pen)
        run: npx playwright test
        env:
          CI: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # Publish the app on GitHub Pages from the default branch.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=GitHub Pages is off::Enable it once: Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

  android:
    # Galaxy Tab APK: the same web build inside a WebView shell (android/).
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Release key from secrets (else a throwaway debug key, see README)
        id: key
        env:
          SUMI_KEYSTORE_B64: ${{ secrets.SUMI_KEYSTORE_B64 }}
        run: |
          if [ -n "$SUMI_KEYSTORE_B64" ]; then
            echo "$SUMI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SUMI_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=APK signing key not set::Add the SUMI_KEYSTORE_* secrets (README → 署名鍵) so APK updates install over the previous version."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        working-directory: android
        env:
          SUMI_VERSION_CODE: ${{ github.run_number }}
          SUMI_VERSION_NAME: 1.${{ github.run_number }}
          SUMI_KEYSTORE_PASSWORD: ${{ secrets.SUMI_KEYSTORE_PASSWORD }}
          SUMI_KEY_ALIAS: ${{ secrets.SUMI_KEY_ALIAS }}
          SUMI_KEY_PASSWORD: ${{ secrets.SUMI_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/SumiNote.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SumiNote-apk
          path: ${{ runner.temp }}/SumiNote.apk
          retention-days: 30
      - name: Publish as the latest release (default branch)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          notes="Sumi Note 1.${{ github.run_number }} ($(git rev-parse --short HEAD)) — Galaxy Tab 向け APK。
          入れ方: このページの SumiNote.apk をタブレットで開く →「この提供元のアプリを許可」→ インストール。"
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            notes="$notes
          同じ鍵で署名しているので上書き更新でき、ノートは消えない。"
          else
            notes="$notes
          ⚠ 署名鍵が未設定（ビルドごとに鍵が変わる）。前のバージョンの上に上書きできないので、更新するときは必ず「バックアップを書き出す」→ アンインストール → インストール → 取り込み。"
          fi
          if gh release view apk --repo "$REPO" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/apk" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload apk "$RUNNER_TEMP/SumiNote.apk" --clobber --repo "$REPO"
            gh release edit apk --repo "$REPO" --title "Sumi Note 1.${{ github.run_number }}" --notes "$notes" --latest
          else
            gh release create apk "$RUNNER_TEMP/SumiNote.apk" --repo "$REPO" --target "$GITHUB_SHA" --title "Sumi Note 1.${{ github.run_number }}" --notes "$notes" --latest
          fi
